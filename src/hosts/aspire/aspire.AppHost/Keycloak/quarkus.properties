# Raw Quarkus configuration for the Keycloak container, bind-mounted to
# /opt/keycloak/conf/quarkus.properties by AppHost.cs.
#
# This file exists for ONE setting — the size of request headers Keycloak will accept — and only
# because there is no other way in. Keycloak exposes no option of its own: neither
# `kc.sh start-dev --help-all` nor `kc.sh build --help-all` has a header-size flag. Setting the
# environment variable QUARKUS_HTTP_LIMITS_MAX_HEADER_SIZE puts the value in the container's
# environment, where `printenv` confirms it and Keycloak then ignores it, because Keycloak's
# configuration provider does not read `quarkus.*` keys from the environment. A properties file in
# conf/ is the documented route.
#
# WHY RAISE IT: Keycloak sits behind Vert.x, whose default header limits are 8192 bytes. Browser
# cookies are scoped by HOST, not by port and not by scheme — RFC 6265 section 8.5 says it outright:
# "cookies do not provide isolation by port". So every other application a developer runs on
# localhost, on any port, leaves cookies at path `/` that the browser then sends to Keycloak as
# well. On a machine running several local stacks that pile passes 8 KB easily, and the symptom is a
# bare "431 Request Header Fields Too Large" from the admin console or any login page, with nothing
# in Keycloak's log to explain it. Measured on such a machine: roughly 5.5 KB of cookies plus the
# ordinary 2.4 KB of request headers is enough to trip it.
#
# BOTH LINES ARE NEEDED, AND THE SECOND IS THE ONE THAT ACTUALLY FIXES THE BROWSER.
# They govern different protocols, and raising only the familiar one looks like a fix while changing
# nothing a browser can observe:
#
#   max-header-size       HTTP/1.1 only. Vert.x default 8192.
#   max-header-list-size  HTTP/2's SETTINGS_MAX_HEADER_LIST_SIZE, advertised to the client in the
#                         connection preface. Vert.x defaults it to 8192 as well, and it is NOT
#                         derived from max-header-size.
#
# Aspire gives this container a development certificate, so the realm is served over TLS — and every
# modern browser negotiates HTTP/2 over TLS via ALPN. The browser path is therefore governed
# entirely by the second line. Measured with only the first raised: `curl --http1.1` accepted 30 KB
# of cookies while the default HTTP/2 request still returned 431 at 8 KB.
#
# 32768 is a round 32 KB, and is the same ceiling the sibling indicia-focus-chat repository sets on
# its Keycloak, its Vite dev server and its ASP.NET host — so a developer moving between the two
# meets one number rather than three.
#
# This widens a limit whose job is to bound untrusted input, which would be the wrong trade on an
# internet-facing server. It is confined to development by construction: the container that reads
# this file is created and destroyed per `aspire run`, imports its realm from a file, and runs
# `start-dev`. Nothing mounts it anywhere else.
quarkus.http.limits.max-header-size=32768
quarkus.http.limits.max-header-list-size=32768
